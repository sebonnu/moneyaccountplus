<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>通帳plus - 学生のためのお金管理</title>
<meta name="theme-color" content="#16324F" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="通帳plus" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: #E7E2D2;
  }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; background: none; border: none; }
  .mincho { font-family: 'Shippori Mincho', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .page {
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 28px 12px;
  }
  .phone {
    width: 420px;
    max-width: 100%;
    height: 800px;
    background: #EFECE0;
    border-radius: 30px;
    box-shadow: 0 24px 60px rgba(22,50,79,0.28), 0 0 0 8px #16324F, 0 0 0 9px #0F2338;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  @media (max-width: 460px) {
    .page { padding: 0; }
    .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  .header {
    background: #16324F;
    padding: 20px 20px 16px;
    flex-shrink: 0;
  }
  .header-top { display: flex; align-items: baseline; justify-content: space-between; }
  .brand { color: #F1EDDD; font-size: 19px; letter-spacing: 1px; }
  .header-sub { color: #9FB4CC; font-size: 11.5px; }

  .content { flex: 1; overflow-y: auto; }
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-thumb { background: #D8D3C0; border-radius: 3px; }
  .tab-inner { padding: 18px 18px 90px; }

  .ledger-card {
    background: #fff;
    border: 1px solid #E5E0CF;
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 2px 0 #E5E0CF;
  }
  .ledger-label { font-size: 11px; color: #9C9788; margin-bottom: 4px; letter-spacing: 0.5px; }
  .big-number { font-size: 30px; font-weight: 700; color: #16324F; }
  .perf-line {
    height: 1px;
    background: repeating-linear-gradient(to right, #D8D3C0 0, #D8D3C0 4px, transparent 4px, transparent 9px);
    margin: 12px 0;
  }

  .section { margin-top: 22px; }
  .section-title { font-size: 12.5px; font-weight: 700; color: #6B6656; margin-bottom: 9px; letter-spacing: 0.5px; }

  .ledger-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 4px; border-bottom: 1px dashed #DEDACB;
    animation: fadeUp 0.25s ease;
  }
  .ledger-row .memo { font-size: 13.5px; color: #1F2A37; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger-row .meta { font-size: 11px; color: #9C9788; margin-top: 2px; }
  .ledger-row .amt { font-size: 14px; font-weight: 700; color: #1F2A37; white-space: nowrap; }

  .settle-row {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #E5E0CF; border-radius: 10px;
    padding: 9px 12px; margin-bottom: 7px; font-size: 13px;
  }
  .settle-row b { font-weight: 700; }
  .settle-amt { margin-left: auto; color: #B23A2E; font-weight: 700; }

  .member-tag {
    font-size: 11.5px; background: #F1EDDD; color: #16324F;
    padding: 3px 9px; border-radius: 20px; font-weight: 600; display: inline-block;
  }

  .bar-track { height: 8px; background: #E5E0CF; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#2F9C8F,#57BBAD); border-radius: 5px; }

  .empty-note {
    font-size: 12.5px; color: #9C9788; background: #fff;
    border: 1px dashed #DEDACB; border-radius: 10px; padding: 16px 14px;
    text-align: center; line-height: 1.6;
  }

  .add-button {
    width: 100%; margin-top: 14px; background: #16324F; color: #F1EDDD;
    border-radius: 12px; padding: 12px 0; font-size: 13.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .form-card {
    background: #fff; border: 1px solid #E5E0CF; border-radius: 14px;
    padding: 18px 16px 16px; margin-top: 12px; position: relative;
    animation: fadeUp 0.25s ease;
  }
  .close-btn { position: absolute; top: 10px; right: 10px; padding: 4px; }
  .field-label { font-size: 11.5px; color: #8A8577; font-weight: 700; margin-top: 12px; margin-bottom: 5px; }
  .input-wrap { position: relative; }
  .yen-mark { position: absolute; left: 10px; top: 9px; font-size: 13.5px; color: #8A8577; }
  .input {
    width: 100%; border: 1px solid #E1DDCE; border-radius: 9px; padding: 9px 10px;
    font-size: 13.5px; color: #1F2A37; outline: none; background: #FAF8F0;
  }
  .input:focus { border-color: #16324F; }
  .input.pl26 { padding-left: 26px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid #E1DDCE; border-radius: 20px; padding: 6px 12px;
    font-size: 12px; font-weight: 600; background: #fff; color: #4A4638;
  }
  .chip.active { color: #fff; }

  .submit-btn {
    width: 100%; margin-top: 16px; background: #B23A2E; color: #fff;
    border-radius: 10px; padding: 11px 0; font-size: 13.5px; font-weight: 700;
  }
  .small-add-btn {
    background: #16324F; border-radius: 9px; width: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .add-money-link { color: #2F9C8F; font-size: 12px; font-weight: 700; margin-top: 6px; }
  .trash-btn { padding: 4px; flex-shrink: 0; }

  .pay-btn {
    font-size: 10.5px; font-weight: 700; color: #2F9C8F; border: 1px solid #2F9C8F;
    border-radius: 20px; padding: 5px 9px; flex-shrink: 0; white-space: nowrap; background: #fff;
  }
  .pay-btn.paid { background: #2F9C8F; color: #fff; }

  .nav {
    display: flex; border-top: 1px solid #E1DDCE; background: #F6F3EA;
    padding: 8px 0 10px; flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .nav-btn .label { font-size: 10px; margin-top: 2px; color: #B0AA98; font-weight: 500; }
  .nav-btn.active .label { color: #16324F; font-weight: 700; }
  .nav-dot { position: absolute; bottom: -8px; width: 20px; height: 3px; border-radius: 3px; background: #16324F; }

  .stamp-wrap {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .stamp {
    width: 92px; height: 92px; border-radius: 50%; border: 4px solid #B23A2E; color: #B23A2E;
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700;
    line-height: 1.15; text-align: center; animation: stampIn 0.9s ease forwards;
  }

  @keyframes stampIn {
    0% { opacity: 0; transform: scale(2.4) rotate(-18deg); }
    35% { opacity: 1; transform: scale(0.92) rotate(-14deg); }
    55% { transform: scale(1.05) rotate(-14deg); }
    75% { transform: scale(1) rotate(-14deg); }
    100% { opacity: 0; transform: scale(1) rotate(-14deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  svg.icon { display: block; }

  .onboard-screen {
    height: 100%; width: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 30px;
    text-align: center; position: relative; background: #EFECE0;
  }
  .onboard-skip {
    position: absolute; top: 18px; right: 16px; font-size: 12px;
    color: #8A8577; font-weight: 600; padding: 6px 10px;
  }
  .onboard-icon {
    width: 88px; height: 88px; border-radius: 50%; background: #F1EDDD;
    display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
  }
  .onboard-title { font-size: 19px; color: #16324F; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
  .onboard-text { font-size: 13px; color: #6B6656; line-height: 1.75; max-width: 280px; }
  .onboard-dots { display: flex; gap: 6px; margin: 26px 0 22px; }
  .onboard-dot { width: 6px; height: 6px; border-radius: 50%; background: #D8D3C0; transition: all 0.2s ease; }
  .onboard-dot.active { background: #16324F; width: 16px; border-radius: 4px; }
  .onboard-later { margin-top: 14px; font-size: 12px; color: #9C9788; text-decoration: underline; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= アイコン (inline SVG) ================= */
const ICONS = {
  home: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>`,
  wallet: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 14h2"/></svg>`,
  users: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"/><circle cx="17" cy="8.5" r="2.6"/><path d="M16.2 13.6c2.7.4 4.3 2.3 4.3 5.4"/></svg>`,
  piggy: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-4 0-7 2.6-7 6 0 1.3.4 2.4 1.2 3.4L5 17h3l.8-1.2c.7.15 1.4.2 2.2.2 4 0 7-2.6 7-6s-3-6.4-6-6.4"/><circle cx="8.5" cy="10.5" r=".6" fill="${c}"/><path d="M19 9c1 .3 1.6 1 1.6 2s-.6 1.7-1.6 2"/><path d="M9.5 17.5V19"/></svg>`,
  plus: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  x: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  arrow: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  trash: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>`,
  check: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>`,
  income: (s,c)=>`<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
};

/* ================= チュートリアル ================= */
const TUTORIAL_SLIDES = [
  { icon: "home", title: "ようこそ、通帳plusへ", text: "学生のためのシンプルなお金管理アプリです。使い方を簡単にご紹介します。" },
  { icon: "wallet", title: "支出を記録", text: "使ったお金はカテゴリを選んでサクッと記帳。今月の支出がひと目でわかります。" },
  { icon: "income", title: "収入を記録", text: "バイト代や仕送りなど、入ってきたお金もかんたんに記録できます。" },
  { icon: "users", title: "割り勘・立て替え", text: "友達との立て替えを記録すると、誰が誰にいくら払えばいいか自動で計算。支払いが済んだら「支払い済」を押すだけで収支に反映されます。" },
  { icon: "piggy", title: "貯金目標", text: "欲しいものや旅行のために目標をつくって、所持金からコツコツ貯金できます。" },
];
function hasSeenTutorial() {
  try { return localStorage.getItem("tsuuchoplus_onboarded") === "1"; } catch (e) { return false; }
}
function markTutorialSeen() {
  try { localStorage.setItem("tsuuchoplus_onboarded", "1"); } catch (e) {}
}
function clearMockData() {
  state.expenses = [];
  state.showExpForm = false;
  state.expForm = { amount: "", category: "食費", memo: "" };

  state.incomes = [];
  state.showIncForm = false;
  state.incForm = { amount: "", category: "バイト代", memo: "" };

  state.members = ["自分"];
  state.splitExpenses = [];
  state.showSplitForm = false;
  state.splitForm = { memo: "", amount: "", payer: "自分", among: ["自分"], deadline: "" };

  state.goals = [];
  state.showGoalForm = false;
  state.goalForm = { name: "", target: "", deadline: "" };
  state.addSavingGoalId = null;
  state.addSavingAmount = "";
}

/* ================= 定数 / ヘルパー ================= */
const CATEGORIES = [
  { key: "食費", color: "#B23A2E" },
  { key: "交通", color: "#2F9C8F" },
  { key: "娯楽", color: "#C99A3B" },
  { key: "日用品", color: "#5B7DB1" },
  { key: "貯金", color: "#3F7D6E" },
  { key: "立て替え精算", color: "#7C6FA0" },
  { key: "その他", color: "#8A8577" },
];
const INCOME_CATEGORIES = [
  { key: "バイト代", color: "#2F9C8F" },
  { key: "仕送り", color: "#5B7DB1" },
  { key: "奨学金", color: "#C99A3B" },
  { key: "立て替え精算", color: "#7C6FA0" },
  { key: "その他", color: "#8A8577" },
];
const yen = (n) => `¥${Math.round(n).toLocaleString()}`;
const yenSigned = (n) => `${n<0?"-":""}¥${Math.round(Math.abs(n)).toLocaleString()}`;
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => { const d = new Date(); return `${d.getMonth()+1}/${d.getDate()}`; };
const pad2 = (n) => String(n).padStart(2,"0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
// デモ用モックデータのISO日付を、当月の同じ日付として生成する
const mockISO = (m,d) => { const y = new Date().getFullYear(); return `${y}-${pad2(m)}-${pad2(d)}`; };
const currentYM = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; };
// dateISOが無い（古い）データは「今月」に含めておく後方互換のフォールバック
const isThisMonth = (dateISO) => !dateISO || dateISO.slice(0,7) === currentYM();
const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ================= 永続化（localStorage） ================= */
const STORAGE_KEY = "tsuuchoplus_data";
function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function savePersisted() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      openingBalance: state.openingBalance,
      expenses: state.expenses,
      incomes: state.incomes,
      members: state.members,
      splitExpenses: state.splitExpenses,
      goals: state.goals,
    }));
  } catch (e) {}
}

/* ================= 状態 ================= */
const IS_FIRST_VISIT = !hasSeenTutorial();
const PERSISTED = IS_FIRST_VISIT ? null : loadPersisted();
const state = {
  onboarding: { step: IS_FIRST_VISIT ? "tutorial" : "done", tutorialIndex: 0 },
  openingBalance: PERSISTED ? (PERSISTED.openingBalance||0) : 0,
  balanceInput: "",

  tab: "home",
  expenses: IS_FIRST_VISIT ? [
    { id: uid(), amount: 850, category: "食費", memo: "学食（唐揚げ定食）", date: "7/24", dateISO: mockISO(7,24) },
    { id: uid(), amount: 220, category: "交通", memo: "バス", date: "7/25", dateISO: mockISO(7,25) },
    { id: uid(), amount: 1200, category: "娯楽", memo: "映画", date: "7/26", dateISO: mockISO(7,26) },
    { id: uid(), amount: 600, category: "日用品", memo: "シャンプー", date: "7/26", dateISO: mockISO(7,26) },
  ] : (PERSISTED ? PERSISTED.expenses : []),
  showExpForm: false,
  expForm: { amount: "", category: "食費", memo: "" },

  incomes: IS_FIRST_VISIT ? [
    { id: uid(), amount: 32000, category: "バイト代", memo: "コンビニバイト", date: "7/20", dateISO: mockISO(7,20) },
    { id: uid(), amount: 50000, category: "仕送り", memo: "実家から", date: "7/1", dateISO: mockISO(7,1) },
  ] : (PERSISTED ? PERSISTED.incomes : []),
  showIncForm: false,
  incForm: { amount: "", category: "バイト代", memo: "" },

  members: IS_FIRST_VISIT ? ["自分", "あかり", "けんと", "ゆい"] : (PERSISTED ? PERSISTED.members : ["自分"]),
  splitExpenses: IS_FIRST_VISIT ? [
    { id: uid(), memo: "宿代", amount: 24000, payer: "自分", among: ["自分","あかり","けんと","ゆい"], deadline: "2026-08-05", paid: false },
    { id: uid(), memo: "夜ご飯（焼肉）", amount: 9600, payer: "あかり", among: ["自分","あかり","けんと","ゆい"], deadline: "", paid: false },
  ] : (PERSISTED ? PERSISTED.splitExpenses : []),
  showSplitForm: false,
  splitForm: { memo: "", amount: "", payer: "自分", among: IS_FIRST_VISIT ? ["自分","あかり","けんと","ゆい"] : (PERSISTED ? [...PERSISTED.members] : ["自分"]), deadline: "" },

  goals: IS_FIRST_VISIT ? [
    { id: uid(), name: "沖縄旅行", target: 60000, saved: 23000, deadline: "2026-09-01" },
    { id: uid(), name: "新しいノートPC", target: 120000, saved: 15000, deadline: "" },
  ] : (PERSISTED ? PERSISTED.goals : []),
  showGoalForm: false,
  goalForm: { name: "", target: "", deadline: "" },
  addSavingGoalId: null,
  addSavingAmount: "",
};

/* ================= 集計ロジック ================= */
// 所持金の計算には常に「全期間」の合計を使う（月をまたいでも残高は引き継がれるため）
function totalExpense() { return state.expenses.reduce((s,e)=>s+e.amount,0); }
function totalIncome() { return state.incomes.reduce((s,e)=>s+e.amount,0); }
function walletBalance() { return totalIncome() - totalExpense() + state.openingBalance; }
// 画面表示の「今月の支出／収入」には当月分のみを使う
function thisMonthExpense() { return state.expenses.filter(e=>isThisMonth(e.dateISO)).reduce((s,e)=>s+e.amount,0); }
function thisMonthIncome() { return state.incomes.filter(e=>isThisMonth(e.dateISO)).reduce((s,e)=>s+e.amount,0); }
function categoryData() {
  return CATEGORIES.map(c => ({
    name: c.key, color: c.color,
    value: state.expenses.filter(e=>e.category===c.key && isThisMonth(e.dateISO)).reduce((s,e)=>s+e.amount,0),
  })).filter(c=>c.value>0);
}
function balances() {
  const b = {};
  state.members.forEach(m => b[m]=0);
  state.splitExpenses.filter(se=>!se.paid).forEach(se=>{
    const share = se.amount/se.among.length;
    se.among.forEach(m=>{ if(b[m]===undefined) b[m]=0; b[m]-=share; });
    if(b[se.payer]===undefined) b[se.payer]=0;
    b[se.payer]+=se.amount;
  });
  return b;
}
function settlements() {
  const b = balances();
  const creditors=[], debtors=[];
  Object.entries(b).forEach(([name,val])=>{
    if(val>1) creditors.push({name,val});
    else if(val<-1) debtors.push({name,val:-val});
  });
  creditors.sort((a,b)=>b.val-a.val);
  debtors.sort((a,b)=>b.val-a.val);
  const res=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const amt = Math.min(debtors[i].val, creditors[j].val);
    res.push({from:debtors[i].name, to:creditors[j].name, amount:amt});
    debtors[i].val -= amt; creditors[j].val -= amt;
    if(debtors[i].val<1) i++;
    if(creditors[j].val<1) j++;
  }
  return res;
}

/* ================= ドーナツグラフ ================= */
function donutSVG(data, size=96, outerR=44, innerR=28) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total<=0) return "";
  const cx=size/2, cy=size/2;
  if (data.length===1) {
    const strokeW = outerR-innerR;
    const r=(outerR+innerR)/2;
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${data[0].color}" stroke-width="${strokeW}"/></svg>`;
  }
  let cumulate=0, paths="";
  data.forEach(d=>{
    const a0 = (cumulate/total)*2*Math.PI - Math.PI/2;
    cumulate += d.value;
    const a1 = (cumulate/total)*2*Math.PI - Math.PI/2;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const x1=cx+outerR*Math.cos(a0), y1=cy+outerR*Math.sin(a0);
    const x2=cx+outerR*Math.cos(a1), y2=cy+outerR*Math.sin(a1);
    const x3=cx+innerR*Math.cos(a1), y3=cy+innerR*Math.sin(a1);
    const x4=cx+innerR*Math.cos(a0), y4=cy+innerR*Math.sin(a0);
    paths += `<path d="M ${x1} ${y1} A ${outerR} ${outerR} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 ${large} 0 ${x4} ${y4} Z" fill="${d.color}"/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}

function splitRow(s) {
  const dl = deadlineInfo(s.deadline);
  const isPayerSelf = s.payer === "自分";
  const amInAmong = s.among.includes("自分");
  const involvesSelf = isPayerSelf || amInAmong;
  const ownShare = amInAmong ? s.amount / s.among.length : 0;
  // 自分から見た、この立て替えが精算された時の受け取り額（＋）/ 支払い額（－）
  const selfDelta = isPayerSelf ? (s.amount - ownShare) : -ownShare;

  return `
  <div class="ledger-row" style="${s.paid?"opacity:0.55;":""}">
    <div style="flex:1;min-width:0;">
      <div class="memo">${esc(s.memo)}（${esc(s.payer)}が立替）</div>
      <div class="meta">

        ${dl ? ` ・<span style="color:${dl.color}">${esc(dl.text)}</span>` : ""}
        ${s.paid ? " ・支払い済み" : ""}
      </div>
    </div>
    <div class="mono amt">${yen(s.amount)}</div>
    ${involvesSelf ? `<button class="pay-btn ${s.paid?"paid":""}" data-action="toggle-split-paid" data-id="${s.id}" data-value="${selfDelta}">${s.paid?"精算済み":"支払い済"}</button>` : ""}
    <button class="trash-btn" data-action="delete-split" data-id="${s.id}">${ICONS.trash(13,"#B0AA98")}</button>
  </div>`;
}
function deadlineInfo(deadline) {
  if (!deadline) return null;
  const target = new Date(deadline + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((target - now) / (1000*60*60*24));
  const label = `${target.getFullYear()}/${target.getMonth()+1}/${target.getDate()}`;
  if (diffDays < 0) return { text: `期限切れ（${label}）`, color: "#B23A2E" };
  if (diffDays === 0) return { text: `今日が期限（${label}）`, color: "#B23A2E" };
  return { text: `期限：${label}（あと${diffDays}日）`, color: "#9C9788" };
}

function setPath(obj, path, value) {
  const parts = path.split(".");
  let o = obj;
  for (let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = value;
}

  app.querySelectorAll("[data-bind]").forEach(el=>{
    el.addEventListener("input", (e)=>{
      let v = e.target.value;
      if (el.dataset.numeric) {
        v = v.replace(/[^0-9]/g,"");
        e.target.value = v;
      }
      setPath(state, el.dataset.bind, v);
    });
  });
  // クリック系
  app.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      const action = el.dataset.action;
      const value = el.dataset.value;
      const id = el.dataset.id;
      handleAction(action, value, id);
    });
  });
}

function handleAction(action, value, id) {
  switch(action) {
    case "skip-tutorial":
    case "finish-tutorial":
      state.onboarding.step = "balance"; render(); break;
    case "next-tutorial":
      state.onboarding.tutorialIndex = Math.min(state.onboarding.tutorialIndex+1, TUTORIAL_SLIDES.length-1);
      render(); break;
    case "finish-onboarding": {
      const amt = parseFloat(state.balanceInput);
      state.openingBalance = (!isNaN(amt) && amt>0) ? amt : 0;
      state.onboarding.step = "done";
      clearMockData();
      markTutorialSeen();
      render(); fireStamp();
      break;
    }
    case "skip-balance":
      state.openingBalance = 0;
      state.onboarding.step = "done";
      clearMockData();
      markTutorialSeen();
      render();
      break;

    case "set-tab":
      state.tab = value; render(); break;

    case "toggle-exp-form":
      state.showExpForm = !state.showExpForm; render(); break;
    case "select-exp-category":
      state.expForm.category = value; render(); break;
    case "submit-expense": {
      const amt = parseFloat(state.expForm.amount);
      if (!amt || amt<=0) return;
      state.expenses.unshift({ id: uid(), amount: amt, category: state.expForm.category, memo: state.expForm.memo.trim()||"（メモなし）", date: todayStr(), dateISO: todayISO() });
      state.expForm = { amount:"", category:"食費", memo:"" };
      state.showExpForm = false;
      render(); fireStamp();
      break;
    }
    case "delete-expense":
      state.expenses = state.expenses.filter(e=>e.id!==id); render(); break;

    case "toggle-inc-form":
      state.showIncForm = !state.showIncForm; render(); break;
    case "select-inc-category":
      state.incForm.category = value; render(); break;
    case "submit-income": {
      const amt = parseFloat(state.incForm.amount);
      if (!amt || amt<=0) return;
      state.incomes.unshift({ id: uid(), amount: amt, category: state.incForm.category, memo: state.incForm.memo.trim()||"（メモなし）", date: todayStr(), dateISO: todayISO() });
      state.incForm = { amount:"", category:"バイト代", memo:"" };
      state.showIncForm = false;
      render(); fireStamp();
      break;
    }
    case "delete-income":
      state.incomes = state.incomes.filter(e=>e.id!==id); render(); break;

    case "toggle-split-form":
      state.showSplitForm = !state.showSplitForm; render(); break;
    case "select-payer":
      state.splitForm.payer = value; render(); break;
    case "toggle-among": {
      const among = state.splitForm.among;
      state.splitForm.among = among.includes(value) ? among.filter(m=>m!==value) : [...among, value];
      render(); break;
    }
    case "add-member": {
      const input = document.getElementById("newMemberInput");
      const name = input.value.trim();
      if (!name || state.members.includes(name)) return;
      state.members.push(name);
      state.splitForm.among.push(name);
      render();
      break;
    }
    case "submit-split": {
      const amt = parseFloat(state.splitForm.amount);
      if (!amt || amt<=0 || state.splitForm.among.length===0) return;
      state.splitExpenses.unshift({ id: uid(), memo: state.splitForm.memo.trim()||"（メモなし）", amount: amt, payer: state.splitForm.payer, among: [...state.splitForm.among], deadline: state.splitForm.deadline, paid: false });
      state.splitForm = { memo:"", amount:"", payer:"自分", among:[...state.members], deadline:"" };
      state.showSplitForm = false;
      render(); fireStamp();
      break;
    }
    case "delete-split": {
      const target = state.splitExpenses.find(s=>s.id===id);
      if (target && target.paid) {
        if (target.settleEntryType === "income") state.incomes = state.incomes.filter(e=>e.id!==target.settleEntryId);
        if (target.settleEntryType === "expense") state.expenses = state.expenses.filter(e=>e.id!==target.settleEntryId);
      }
      state.splitExpenses = state.splitExpenses.filter(s=>s.id!==id);
      render(); break;
    }

    case "toggle-split-paid": {
      const s = state.splitExpenses.find(sp=>sp.id===id);
      if (!s) return;
      if (!s.paid) {
        // 支払い済にする：自分が受け取った分は「収入」に、自分が支払った分は「支出」に記帳する
        const ownShare = s.among.includes("自分") ? s.amount / s.among.length : 0;
        const isPayerSelf = s.payer === "自分";
        const delta = isPayerSelf ? (s.amount - ownShare) : -ownShare;
        if (delta > 0) {
          const entry = { id: uid(), amount: delta, category: "立て替え精算", memo: `${s.memo}の精算（受取）`, date: todayStr(), dateISO: todayISO() };
          state.incomes.unshift(entry);
          s.settleEntryId = entry.id; s.settleEntryType = "income";
        } else if (delta < 0) {
          const entry = { id: uid(), amount: -delta, category: "立て替え精算", memo: `${s.memo}の精算（支払）`, date: todayStr(), dateISO: todayISO() };
          state.expenses.unshift(entry);
          s.settleEntryId = entry.id; s.settleEntryType = "expense";
        }
        s.paid = true;
        render(); fireStamp();
      } else {
        // 取り消し：記帳した収入・支出を削除する
        if (s.settleEntryType === "income") state.incomes = state.incomes.filter(e=>e.id!==s.settleEntryId);
        if (s.settleEntryType === "expense") state.expenses = state.expenses.filter(e=>e.id!==s.settleEntryId);
        s.paid = false; s.settleEntryId = null; s.settleEntryType = null;
        render();
      }
      break;
    }

    case "toggle-goal-form":
      state.showGoalForm = !state.showGoalForm; render(); break;
    case "submit-goal": {
      const t = parseFloat(state.goalForm.target);
      if (!state.goalForm.name.trim() || !t || t<=0) return;
      state.goals.push({ id: uid(), name: state.goalForm.name.trim(), target: t, saved: 0, deadline: state.goalForm.deadline });
      state.goalForm = { name:"", target:"", deadline:"" };
      state.showGoalForm = false;
      render();
      break;
    }
    case "delete-goal":
      state.goals = state.goals.filter(g=>g.id!==id);
      if (state.addSavingGoalId===id) { state.addSavingGoalId=null; state.addSavingAmount=""; }
      render(); break;

    case "toggle-add-saving":
      state.addSavingGoalId = state.addSavingGoalId===id ? null : id;
      state.addSavingAmount = "";
      render(); break;
    case "submit-saving": {
      const amt = parseFloat(state.addSavingAmount);
      if (!amt || amt<=0) return;
      const g = state.goals.find(gg=>gg.id===id);
      if (!g) return;
      g.saved += amt;
      state.expenses.unshift({ id: uid(), amount: amt, category: "貯金", memo: `${g.name}に貯金`, date: todayStr(), dateISO: todayISO() });
      state.addSavingAmount = "";
      state.addSavingGoalId = null;
      render(); fireStamp();
      break;
    }
  }
}

render();

/* ================= PWA: Service Worker登録 ================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
