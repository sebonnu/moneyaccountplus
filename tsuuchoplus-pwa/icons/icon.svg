<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="bookClip">
      <rect x="146" y="122" width="222" height="284" rx="20"/>
    </clipPath>
  </defs>

  <!-- 背景（フルブリード：マスカブルアイコン対応） -->
  <rect x="0" y="0" width="512" height="512" fill="#16324F"/>

  <!-- 通帳の本体（クリーム色） -->
  <rect x="146" y="122" width="222" height="284" rx="20" fill="#F1EDDD"/>

  <!-- 背表紙（ゴールド） -->
  <rect x="146" y="122" width="36" height="284" fill="#C99A3B" clip-path="url(#bookClip)"/>

  <!-- 通帳の中の罫線（台帳っぽさ） -->
  <rect x="206" y="196" width="130" height="9" rx="4.5" fill="#9FB4CC"/>
  <rect x="206" y="228" width="100" height="9" rx="4.5" fill="#D8D3C0"/>
  <rect x="206" y="260" width="118" height="9" rx="4.5" fill="#D8D3C0"/>
  <rect x="206" y="292" width="86" height="9" rx="4.5" fill="#D8D3C0"/>

  <!-- ワンポイントのプラスバッジ（"plus"） -->
  <circle cx="384" cy="384" r="52" fill="#2F9C8F" stroke="#16324F" stroke-width="8"/>
  <rect x="360" y="378" width="48" height="12" rx="6" fill="#F1EDDD"/>
  <rect x="378" y="360" width="12" height="48" rx="6" fill="#F1EDDD"/>
</svg>
